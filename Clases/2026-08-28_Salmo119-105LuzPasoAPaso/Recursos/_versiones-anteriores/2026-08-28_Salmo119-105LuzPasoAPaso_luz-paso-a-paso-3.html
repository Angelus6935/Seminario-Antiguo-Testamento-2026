<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Luz Paso a Paso: El Viaje de Adán y Eva</title>
<style>
  :root{
    --blue:#3ecbff; --blue-soft:#7fdcff; --gold:#ffd166; --gold-soft:#ffe6a0;
    --night:#0a0e17; --night2:#111a2e; --night3:#182552;
    --text:#eaf4ff; --muted:#9db3cc; --danger:#ff5d7a; --ok:#5dffb0;
    --card:#101a3a; --border:rgba(62,203,255,0.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:radial-gradient(circle at 20% 0%, #14213f 0%, var(--night) 55%, #05070d 100%);
    color:var(--text); min-height:100vh; display:flex; justify-content:center; overflow:hidden;
  }
  #app{ width:100%; max-width:480px; height:100vh; height:100dvh; display:flex; flex-direction:column;
        padding:14px 14px 18px; position:relative; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .screen{ display:none; flex-direction:column; gap:12px; animation:fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  h1{ font-size:1.35rem; text-align:center; margin:4px 0 0; letter-spacing:0.4px;
      background:linear-gradient(90deg,var(--blue),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle{ text-align:center; color:var(--muted); font-size:0.82rem; margin-top:-8px; }
  .logo-orb{ width:64px; height:64px; margin:2px auto 0; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, var(--blue), #14355a 70%); font-size:1.7rem;
      display:flex; align-items:center; justify-content:center; box-shadow:0 0 26px rgba(62,203,255,0.5), inset 0 0 16px rgba(0,0,0,0.35); }
  .card{ background:linear-gradient(160deg,var(--card),var(--night2)); border:1px solid var(--border);
      border-radius:16px; padding:14px; box-shadow:0 6px 20px rgba(0,0,0,0.35); }
  label{ font-size:0.8rem; color:var(--muted); display:block; margin-bottom:6px; font-weight:600; }
  input[type=text], textarea{ width:100%; background:var(--night3); border:1px solid var(--border); border-radius:10px;
      padding:12px; color:var(--text); font-size:1rem; font-family:inherit; outline:none; }
  textarea{ resize:vertical; min-height:70px; }
  input[type=text]:focus, textarea:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,209,102,0.15); }

  .lang-row{ display:flex; gap:10px; }
  .lang-btn{ flex:1; padding:11px 8px; border-radius:10px; border:1px solid var(--border); background:var(--night3);
      color:var(--muted); font-weight:700; text-align:center; cursor:pointer; font-size:0.9rem; }
  .lang-btn.selected{ background:linear-gradient(135deg,var(--blue),#1c7fb0); color:#03131c; border-color:transparent;
      box-shadow:0 4px 14px rgba(62,203,255,0.4); }

  .char-grid{ display:flex; gap:12px; }
  .char-card{ flex:1; border-radius:14px; padding:14px 8px; text-align:center; background:var(--night3);
      border:2px solid rgba(255,255,255,0.08); cursor:pointer; }
  .char-card.selected{ border-color:var(--gold); box-shadow:0 0 18px rgba(255,209,102,0.45); }
  .char-emoji{ font-size:2.3rem; display:block; margin-bottom:4px; }
  .char-name{ font-weight:800; font-size:0.98rem; }

  .btn{ display:block; width:100%; padding:14px; border:none; border-radius:12px; font-size:1rem; font-weight:800;
      cursor:pointer; background:linear-gradient(135deg,var(--blue),#1c7fb0); color:#03131c;
      box-shadow:0 6px 18px rgba(62,203,255,0.35); transition:transform .12s ease, opacity .2s; }
  .btn:active{ transform:scale(0.97); }
  .btn.gold{ background:linear-gradient(135deg,var(--gold),#c98f1c); color:#241800; box-shadow:0 6px 18px rgba(255,209,102,0.4); }
  .btn.secondary{ background:var(--night3); color:var(--text); border:1px solid var(--border); box-shadow:none; }
  .btn:disabled{ opacity:0.35; box-shadow:none; cursor:not-allowed; }
  .instructions{ font-size:0.8rem; color:var(--muted); line-height:1.5; }

  /* ===== GAME SCREEN ===== */
  #screen-game{ padding:0; gap:0; position:relative; }
  #game-wrap{ position:relative; width:100%; aspect-ratio:2/3; border-radius:16px; overflow:hidden;
      border:1px solid var(--border); box-shadow:0 8px 26px rgba(0,0,0,0.4); background:var(--night); }
  canvas{ width:100%; height:100%; display:block; touch-action:none; }

  #hud-top{ position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between;
      align-items:flex-start; pointer-events:none; z-index:5; }
  .hud-pill{ background:rgba(6,10,22,0.7); border:1px solid var(--border); border-radius:20px; padding:5px 12px;
      font-size:0.72rem; font-weight:700; }

  #toast{ position:absolute; top:46%; left:50%; transform:translate(-50%,-50%); background:rgba(6,10,22,0.88);
      border:1px solid var(--blue); border-radius:14px; padding:14px 18px; max-width:82%; text-align:center;
      font-size:0.85rem; line-height:1.5; z-index:8; display:none; }

  #controls{ position:absolute; bottom:10px; left:8px; right:8px; display:flex; justify-content:space-between;
      align-items:flex-end; z-index:5; }
  .dpad{ display:flex; gap:8px; }
  .ctrl-btn{ width:54px; height:54px; border-radius:16px; background:rgba(24,37,82,0.78); border:1px solid var(--border);
      color:var(--text); font-size:1.35rem; display:flex; align-items:center; justify-content:center; }
  .action-btns{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .ctrl-btn.jump{ width:62px; height:62px; background:rgba(62,203,255,0.22); border-color:var(--blue); }
  .ctrl-btn.fire{ width:56px; height:56px; background:rgba(255,209,102,0.12); border-color:rgba(255,209,102,0.35); opacity:0.4; }
  .ctrl-btn.fire.enabled{ opacity:1; background:rgba(255,209,102,0.3); border-color:var(--gold); box-shadow:0 0 16px rgba(255,209,102,0.4); }
  .ctrl-btn.active-touch{ transform:scale(0.9); }

  /* ===== MODAL TRIVIA ===== */
  .modal-overlay{ position:fixed; inset:0; background:rgba(3,6,16,0.82); display:none; align-items:center;
      justify-content:center; z-index:50; padding:20px; }
  .modal-overlay.active{ display:flex; }
  .modal-card{ width:100%; max-width:420px; background:linear-gradient(160deg,#132049,#0c1533);
      border:1px solid var(--blue); border-radius:18px; padding:20px; box-shadow:0 0 40px rgba(62,203,255,0.25); }
  .modal-tag{ color:var(--gold); font-size:0.75rem; font-weight:800; letter-spacing:0.6px; text-transform:uppercase; margin-bottom:10px; }
  .modal-q{ font-size:1rem; margin-bottom:14px; line-height:1.42; font-weight:600; }
  .option{ display:block; width:100%; text-align:left; background:var(--night3); border:1px solid var(--border);
      color:var(--text); padding:13px 14px; border-radius:12px; margin-bottom:10px; cursor:pointer; font-size:0.9rem; line-height:1.4; }
  .option:disabled{ opacity:0.55; }
  .option.correct{ border-color:var(--ok); background:rgba(93,255,176,0.15); }
  .option.wrong{ border-color:var(--danger); background:rgba(255,93,122,0.15); }
  .feedback-box{ border-radius:12px; padding:11px 13px; font-size:0.86rem; line-height:1.4; border:1px solid var(--border);
      background:var(--night3); display:none; margin-top:6px; }
  .feedback-box.good{ border-color:var(--ok); color:var(--ok); display:block; }
  .feedback-box.bad{ border-color:var(--danger); color:var(--danger); display:block; }

  /* ===== FINAL ===== */
  .final-score{ text-align:center; font-size:2.3rem; font-weight:900; color:var(--blue);
      text-shadow:0 0 16px rgba(62,203,255,0.6); margin:6px 0 2px; }
  .refl-summary{ text-align:left; font-size:0.85rem; line-height:1.5; color:var(--muted);
      background:rgba(255,255,255,0.03); border-radius:10px; padding:12px; }
  .refl-summary b{ color:var(--gold-soft); display:block; margin-top:8px; }
  .refl-summary b:first-child{ margin-top:0; }
  body.capture-mode #controls, body.capture-mode #hud-top, body.capture-mode .no-capture{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <div class="screen active" id="screen-start">
    <div class="logo-orb">🌌</div>
    <h1 id="t-title">Luz Paso a Paso</h1>
    <p class="subtitle" id="t-subtitle">El Viaje de Adán y Eva</p>

    <div class="card instructions" id="t-intro-lore"></div>

    <div class="card">
      <label id="t-char-label">Elige tu personaje</label>
      <div class="char-grid">
        <div class="char-card" id="pick-adan" data-char="Adán">
          <span class="char-emoji">🏃🏻‍♂️</span><span class="char-name">Adán</span>
        </div>
        <div class="char-card" id="pick-eva" data-char="Eva">
          <span class="char-emoji">🏃🏻‍♀️</span><span class="char-name">Eva</span>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="t-name-label">Escribe tu nombre</label>
      <input type="text" id="input-name" maxlength="30" placeholder="Tu nombre...">
    </div>

    <div class="card">
      <label id="t-lang-label">Elige tu idioma / Choose your language</label>
      <div class="lang-row">
        <div class="lang-btn selected" id="btn-lang-es">Español</div>
        <div class="lang-btn" id="btn-lang-en">English</div>
      </div>
    </div>

    <div class="card instructions" id="t-instructions"></div>

    <button class="btn gold" id="btn-start" disabled>Comenzar</button>
  </div>

  <!-- NARRATIVA DE NIVEL -->
  <div class="screen" id="screen-narrative">
    <div class="card">
      <div class="modal-tag" id="nar-chapter">CAPÍTULO 1</div>
      <h1 id="nar-title" style="font-size:1.15rem; -webkit-text-fill-color:var(--gold); background:none;"></h1>
      <p class="instructions" id="nar-text" style="font-size:0.92rem; margin-top:8px;"></p>
      <button class="btn" id="btn-nar-continue">Continuar</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div id="game-wrap">
      <canvas id="game-canvas" width="480" height="720"></canvas>
      <div id="hud-top">
        <div class="hud-pill" id="hud-level">Nivel 1</div>
        <div class="hud-pill" id="hud-progress">0%</div>
      </div>
      <div id="toast"></div>
      <div id="controls">
        <div class="dpad">
          <div class="ctrl-btn" id="btn-left">◀</div>
          <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="action-btns">
          <div class="ctrl-btn fire" id="btn-fire">✨</div>
          <div class="ctrl-btn jump" id="btn-jump">⬆</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TRIVIA MODAL -->
  <div class="modal-overlay" id="trivia-modal">
    <div class="modal-card">
      <div class="modal-tag" id="trivia-tag">📜 PERGAMINO SAGRADO</div>
      <p class="modal-q" id="trivia-question"></p>
      <div id="trivia-options"></div>
      <div class="feedback-box" id="trivia-feedback"></div>
      <button class="btn gold" id="btn-trivia-continue" style="display:none; margin-top:10px;">Continuar</button>
    </div>
  </div>

  <!-- EPILOGO -->
  <div class="screen" id="screen-epilogue">
    <div class="logo-orb">🌅</div>
    <h1 id="t-epi-title" style="font-size:1.2rem;">El Amanecer</h1>
    <div class="card instructions" id="t-epi-text"></div>
    <button class="btn gold" id="btn-epilogue-continue">Continuar</button>
  </div>

  <!-- REFLEXION -->
  <div class="screen" id="screen-reflection">
    <div class="card">
      <h1 id="t-refl-title" style="font-size:1.1rem;">🕯️ Reflexión Personal</h1>
      <div style="text-align:left; margin-top:10px;">
        <label id="t-refl1-label"></label>
        <textarea id="refl1"></textarea>
      </div>
      <div style="text-align:left; margin-top:12px;">
        <label id="t-refl2-label"></label>
        <textarea id="refl2"></textarea>
      </div>
      <div style="text-align:left; margin-top:12px;">
        <label id="t-refl3-label"></label>
        <textarea id="refl3"></textarea>
      </div>
      <button class="btn gold" id="btn-finish" style="margin-top:14px;">Completar mi Viaje</button>
    </div>
  </div>

  <!-- RESULTADOS -->
  <div class="screen" id="screen-results">
    <div class="logo-orb">🏆</div>
    <h1 id="t-res-title" style="font-size:1.15rem;">Viaje Completado</h1>
    <div class="card" style="text-align:center;">
      <p style="margin:0; color:var(--muted); font-size:0.85rem;" id="res-name"></p>
      <div class="final-score" id="res-score">0</div>
      <div class="refl-summary" id="res-summary"></div>
    </div>
    <button class="btn no-capture" id="btn-screenshot">📸 Sacar Captura de Pantalla</button>
    <button class="btn secondary no-capture" id="btn-restore" style="display:none;">↩️ Volver</button>
  </div>

</div>

function bindHold(id, onDown, onUp){
  const el = document.getElementById(id);
  const down = ev=>{ ev.preventDefault(); el.classList.add('active-touch'); onDown(); };
  const up = ev=>{ if(ev)ev.preventDefault(); el.classList.remove('active-touch'); onUp(); };
  el.addEventListener('touchstart', down, {passive:false});
  el.addEventListener('touchend', up, {passive:false});
  el.addEventListener('touchcancel', up, {passive:false});
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}
bindHold('btn-left',  ()=>{ if(game) game.keys.left = true; },  ()=>{ if(game) game.keys.left = false; });
bindHold('btn-right', ()=>{ if(game) game.keys.right = true; }, ()=>{ if(game) game.keys.right = false; });
bindHold('btn-jump',  ()=>{ if(game) game.keys.jump = true; },  ()=>{ if(game) game.keys.jump = false; });
bindHold('btn-fire',  ()=> throwFireball(), ()=>{});

window.addEventListener('keydown', e=>{
  if(!game) return;
  if(e.code==='ArrowLeft'||e.code==='KeyA') game.keys.left = true;
  if(e.code==='ArrowRight'||e.code==='KeyD') game.keys.right = true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') game.keys.jump = true;
  if(e.code==='KeyF') throwFireball();
});
window.addEventListener('keyup', e=>{
  if(!game) return;
  if(e.code==='ArrowLeft'||e.code==='KeyA') game.keys.left = false;
  if(e.code==='ArrowRight'||e.code==='KeyD') game.keys.right = false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') game.keys.jump = false;
});

/* ============================================================
   FÍSICA / COLISIONES
============================================================ */
function aabbOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function playerBox(p){ return {x:p.x, y:p.y, w:p.w, h:p.h}; }

function updatePlayerPhysics(dt){
  const p = game.player;
  let ax = 0;
  if(game.keys.left){ ax=-1; p.facing=-1; }
  if(game.keys.right){ ax=1; p.facing=1; }
  p.vx = ax*MOVE_SPEED;

  p.vy += GRAVITY*dt;
  if(game.keys.jump && p.onGround){ p.vy = JUMP_VELOCITY; p.onGround=false; }

  p.x += p.vx*dt;
  p.x = Math.max(0, Math.min(game.worldW - p.w, p.x));
  resolveCollisions(p,'x');

  p.y += p.vy*dt;
  p.onGround = false;
  resolveCollisions(p,'y');

  if(p.y > VIEW_H+120){ p.x = Math.max(0, p.x-200); p.y=0; p.vy=0; }
  if(p.invuln>0) p.invuln -= dt;
}
function resolveCollisions(p, axis){
  for(const plat of game.platforms){
    if(!aabbOverlap(playerBox(p), plat)) continue;
    if(axis==='x'){
      if(p.vx>0) p.x = plat.x - p.w;
      else if(p.vx<0) p.x = plat.x + plat.w;
    } else {
      if(p.vy>0){ p.y = plat.y - p.h; p.vy=0; p.onGround=true; }
      else if(p.vy<0){ p.y = plat.y + plat.h; p.vy=0; }
    }
  }
}
function updateCamera(){
  const p = game.player;
  game.camX = Math.max(0, Math.min(game.worldW - VIEW_W, p.x - VIEW_W/2));
}
function updateProgress(){
  const pct = Math.min(100, Math.round((game.player.x / game.goal.x)*100));
  document.getElementById('hud-progress').textContent = pct+'%';
}

/* ============================================================
   CHISPAS Y PERGAMINO
============================================================ */
function updateChispas(){
  const p = game.player;
  for(const c of game.chispas){
    if(c.collected) continue;
    const box = {x:c.x-14, y:c.y-14, w:28, h:28};
    if(aabbOverlap(playerBox(p), box)){ c.collected = true; Game.score += 100; }
  }
}
function updatePergamino(){
  const p = game.player;
  const m = game.pergamino;
  if(m.collected || game.triviaOpen) return;
  if(performance.now() < game.triviaCooldownUntil) return;
  const box = {x:m.x-20, y:m.y-20, w:40, h:40};
  if(aabbOverlap(playerBox(p), box)) openTrivia();
}

let currentQuestion = null;
function openTrivia(){
  game.triviaOpen = true;
  const bank = QUESTION_BANKS[Game.levelIndex];
  currentQuestion = bank[Math.floor(Math.random()*bank.length)];
  document.getElementById('trivia-tag').textContent = T('triviaTag');
  document.getElementById('trivia-question').textContent = currentQuestion.q[state.lang];
  const feedback = document.getElementById('trivia-feedback');
  feedback.style.display = 'none'; feedback.className = 'feedback-box';
  document.getElementById('btn-trivia-continue').style.display = 'none';

  const optsWrap = document.getElementById('trivia-options');
  optsWrap.innerHTML = '';
  currentQuestion.opts[state.lang].forEach((text, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = text;
    btn.addEventListener('click', ()=>answerTrivia(idx, btn));
    optsWrap.appendChild(btn);
  });
  document.getElementById('trivia-modal').classList.add('active');
}
function answerTrivia(idx, btnEl){
  document.querySelectorAll('#trivia-options .option').forEach(b=>b.disabled=true);
  const opts = document.querySelectorAll('#trivia-options .option');
  const feedback = document.getElementById('trivia-feedback');
  const correct = idx === currentQuestion.correct;
  if(correct){
    game.pergamino.collected = true;
    game.poweredUp = true;
    Game.score += 500;
    document.getElementById('btn-fire').classList.add('enabled');
    btnEl.classList.add('correct');
    feedback.className = 'feedback-box good';
    feedback.textContent = T('triviaCorrect');
    spawnEnemyWave();
  } else {
    btnEl.classList.add('wrong');
    opts[currentQuestion.correct].classList.add('correct');
    feedback.className = 'feedback-box bad';
    feedback.textContent = T('triviaWrong');
  }
  document.getElementById('btn-trivia-continue').style.display = 'block';
}
document.getElementById('btn-trivia-continue').addEventListener('click', ()=>{
  document.getElementById('trivia-modal').classList.remove('active');
  game.triviaOpen = false;
  game.triviaCooldownUntil = performance.now() + 900;
});

/* ============================================================
   ENEMIGOS Y DISPARO DE FE
============================================================ */
function spawnEnemyWave(){
  const p = game.player;
  for(const t of game.layout.enemySpawnsAfterPower){
    const cx = p.x + t.dx;
    game.enemies.push({
      x:cx, y:t.y, minX:Math.max(0,cx-t.range), maxX:Math.min(game.worldW-20,cx+t.range),
      speed:t.speed, dir:-1, alive:true
    });
  }
}
function updateEnemies(dt){
  const p = game.player;
  for(const e of game.enemies){
    if(!e.alive) continue;
    e.x += e.dir*e.speed*dt;
    if(e.x < e.minX){ e.x=e.minX; e.dir=1; }
    if(e.x > e.maxX){ e.x=e.maxX; e.dir=-1; }
    const eBox = {x:e.x-15, y:e.y-15, w:30, h:30};
    if(aabbOverlap(playerBox(p), eBox) && p.invuln<=0){
      p.invuln = 1.1;
      p.vx = -p.facing*180;
      p.x = Math.max(0, p.x - p.facing*22);
    }
  }
  for(const f of game.fireballs){
    if(!f.alive) continue;
    for(const e of game.enemies){
      if(!e.alive) continue;
      const eBox = {x:e.x-15, y:e.y-15, w:30, h:30};
      const fBox = {x:f.x-6, y:f.y-6, w:12, h:12};
      if(aabbOverlap(fBox, eBox)){ e.alive=false; f.alive=false; Game.score += 150; }
    }
  }
}
function throwFireball(){
  if(!game || !game.poweredUp || game.triviaOpen) return;
  const p = game.player;
  game.fireballs.push({x:p.x+p.w/2, y:p.y+p.h/2, vx:p.facing*420, alive:true});
}
function updateFireballs(dt){
  for(const f of game.fireballs){
    if(!f.alive) continue;
    f.x += f.vx*dt;
    if(f.x < game.camX-40 || f.x > game.camX+VIEW_W+40) f.alive=false;
  }
  game.fireballs = game.fireballs.filter(f=>f.alive);
}

/* ============================================================
   META Y AVANCE DE NIVEL
============================================================ */
function checkGoal(){
  if(aabbOverlap(playerBox(game.player), game.goal)) finishLevel();
}
function finishLevel(){
  if(game.finished) return;
  game.finished = true;
  game.running = false;
  setTimeout(()=>{
    Game.levelIndex++;
    if(Game.levelIndex >= LEVELS.length){ showScreen('screen-epilogue'); }
    else { showLevelNarrative(); }
  }, 350);
}

/* ============================================================
   LOOP
============================================================ */
function loop(ts){
  if(!game || !game.running) return;
  const dt = Math.min(0.033, (ts-game.lastTime)/1000);
  game.lastTime = ts;
  if(!game.triviaOpen){
    updatePlayerPhysics(dt);
    updateChispas();
    updatePergamino();
    updateEnemies(dt);
    updateFireballs(dt);
    updateCamera();
    updateProgress();
    checkGoal();
  }
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   RENDER
============================================================ */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
function draw(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const lvl = LEVELS[Game.levelIndex];
  const sky = ctx.createLinearGradient(0,0,0,VIEW_H);
  sky.addColorStop(0, lvl.bg[1]); sky.addColorStop(1, lvl.bg[0]);
  ctx.fillStyle = sky; ctx.fillRect(0,0,VIEW_W,VIEW_H);

  // luna / sol fijo en pantalla (no se mueve con la cámara, da sensación de escenario real)
  ctx.beginPath(); ctx.arc(VIEW_W*0.78, 120, 46, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.beginPath(); ctx.arc(VIEW_W*0.78, 120, 30, 0, Math.PI*2);
  ctx.fillStyle = lvl.accent; ctx.globalAlpha = 0.5; ctx.fill(); ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(-game.camX, 0);

  // estrellas
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  for(let i=0;i<90;i++){
    const sx = (i*131) % game.worldW, sy = (i*77) % 340;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // montañas de paralaje (fondo lejano, se mueven más lento que la cámara)
  ctx.fillStyle = lvl.accentDark;
  ctx.globalAlpha = 0.55;
  for(let mx=-200; mx<game.worldW+400; mx+=340){
    const px = mx + game.camX*0.35;
    ctx.beginPath();
    ctx.moveTo(px-170, GROUND_Y);
    ctx.lineTo(px, GROUND_Y-150);
    ctx.lineTo(px+170, GROUND_Y);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // plataformas (color temático de cada nivel)
  for(const plat of game.platforms){
    const grad = ctx.createLinearGradient(0,plat.y,0,plat.y+plat.h);
    grad.addColorStop(0, lvl.accentDark); grad.addColorStop(1,'#05070d');
    ctx.fillStyle = grad;
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    ctx.fillStyle = lvl.accent;
    ctx.shadowColor = lvl.accent; ctx.shadowBlur = 6;
    ctx.fillRect(plat.x, plat.y, plat.w, 5);
    ctx.shadowBlur = 0;
  }

  // chispas
  for(const c of game.chispas){
    if(c.collected) continue;
    ctx.beginPath(); ctx.arc(c.x, c.y, 9, 0, Math.PI*2);
    ctx.fillStyle = '#ffd166'; ctx.shadowColor='#ffd166'; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;
  }

  // pergamino
  if(!game.pergamino.collected){
    ctx.font = '30px serif'; ctx.textAlign='center';
    ctx.shadowColor='#ffd166'; ctx.shadowBlur=16;
    ctx.fillText('📜', game.pergamino.x, game.pergamino.y);
    ctx.shadowBlur=0;
  }

  // enemigos
  for(const e of game.enemies){
    if(!e.alive) continue;
    ctx.font = '30px serif'; ctx.textAlign='center';
    ctx.shadowColor='#ff5d7a'; ctx.shadowBlur=10;
    ctx.fillText(lvl.enemyEmoji, e.x, e.y);
    ctx.shadowBlur=0;
  }

  // fireballs
  ctx.fillStyle = '#ffd166';
  for(const f of game.fireballs){
    if(!f.alive) continue;
    ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI*2); ctx.fill();
  }

  // meta
  drawGoal();
  // jugador
  drawPlayer();

  ctx.restore();
}
function drawGoal(){
  const g = game.goal;
  const lvl = LEVELS[Game.levelIndex];
  ctx.strokeStyle = '#eaf4ff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(g.x, g.y+g.h); ctx.lineTo(g.x, g.y); ctx.stroke();
  ctx.fillStyle = lvl.accent;
  ctx.shadowColor = lvl.accent; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(g.x+36, g.y+14); ctx.lineTo(g.x, g.y+28); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
}
const PLAYER_EMOJI = { Adán:"🏃🏻‍♂️", Eva:"🏃🏻‍♀️" };
function drawPlayer(){
  const p = game.player;
  const lvl = LEVELS[Game.levelIndex];
  ctx.save();
  ctx.translate(p.x+p.w/2, p.y+p.h/2+6);
  if(p.facing<0) ctx.scale(-1,1);
  if(p.invuln>0 && Math.floor(p.invuln*12)%2===0){ ctx.restore(); return; }

  if(game.poweredUp){
    ctx.strokeStyle = lvl.accent;
    ctx.lineWidth = 3;
    ctx.shadowColor = lvl.accent; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0,-4, p.w*1.25, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // pequeño rebote al saltar/correr para que se sienta vivo
  const bob = p.onGround ? Math.sin(performance.now()*0.012)*2 : 0;
  ctx.font = '38px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = state.character==='Eva' ? 'rgba(255,209,102,0.5)' : 'rgba(62,203,255,0.5)';
  ctx.shadowBlur = 8;
  ctx.fillText(PLAYER_EMOJI[state.character] || '🏃🏻‍♂️', 0, bob);
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* ============================================================
   EPÍLOGO -> REFLEXIÓN
============================================================ */
document.getElementById('btn-epilogue-continue').addEventListener('click', ()=>{
  showScreen('screen-reflection');
});

/* ============================================================
   FINALIZAR / PUNTAJE (revelado solo al final)
============================================================ */
document.getElementById('btn-finish').addEventListener('click', ()=>{
  const r1 = document.getElementById('refl1').value.trim();
  const r2 = document.getElementById('refl2').value.trim();
  const r3 = document.getElementById('refl3').value.trim();
  Game.answers = [r1, r2, r3];

  // Regla secreta: +2 puntos por cada carácter escrito en las 3 respuestas
  const totalChars = r1.length + r2.length + r3.length;
  Game.score += totalChars * 2;

  document.getElementById('res-name').textContent = state.name;
  document.getElementById('res-score').textContent = Game.score;
  const summary = document.getElementById('res-summary');
  summary.innerHTML = `
    <b>${T('summary1')}</b>${escapeHtml(r1)||'—'}
    <b>${T('summary2')}</b>${escapeHtml(r2)||'—'}
    <b>${T('summary3')}</b>${escapeHtml(r3)||'—'}
  `;
  showScreen('screen-results');
});
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

/* ============================================================
   CAPTURA DE PANTALLA
============================================================ */
document.getElementById('btn-screenshot').addEventListener('click', ()=>{
  document.body.classList.add('capture-mode');
  document.getElementById('btn-restore').style.display = 'block';
  document.getElementById('btn-restore').classList.remove('no-capture');
});
document.getElementById('btn-restore').addEventListener('click', ()=>{
  document.body.classList.remove('capture-mode');
  document.getElementById('btn-restore').style.display = 'none';
});

/* ============================================================
   INIT
============================================================ */
applyStaticTexts();

})();
