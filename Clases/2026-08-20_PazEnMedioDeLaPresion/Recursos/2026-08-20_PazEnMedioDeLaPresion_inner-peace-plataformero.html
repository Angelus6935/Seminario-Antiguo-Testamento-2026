<style>
  :root{
    --mint:#3ddc97;
    --mint-dark:#1f9b6e;
    --cyan:#38e0d8;
    --night:#0b1229;
    --night2:#111a3a;
    --night3:#182552;
    --text:#eaf7f3;
    --muted:#9fb3c8;
    --danger:#ff6b6b;
    --gold:#ffd166;
    --card:#101a3a;
    --border: rgba(61,220,151,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 0%, #163062 0%, var(--night) 55%, #060a17 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:14px 14px 18px;
    position:relative;
  }
  .screen{ display:none; flex-direction:column; gap:14px; animation: fadeIn .4s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  h1{
    font-size:1.4rem;
    text-align:center;
    margin:4px 0 0;
    background:linear-gradient(90deg,var(--mint),var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:0.5px;
  }
  .subtitle{ text-align:center; color:var(--muted); font-size:0.82rem; margin-top:-8px;}
  .logo-orb{
    width:70px; height:70px; margin:4px auto 0;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--cyan), var(--mint) 60%, var(--night3) 100%);
    box-shadow: 0 0 30px rgba(61,220,151,0.5), inset 0 0 20px rgba(0,0,0,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem;
  }
  .card{
    background: linear-gradient(160deg, var(--card), var(--night2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  label{ font-size:0.8rem; color:var(--muted); display:block; margin-bottom:6px; }
  input[type=text], textarea{
    width:100%;
    background:var(--night3);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    color:var(--text);
    font-size:1rem;
    outline:none;
  }
  textarea{ resize:vertical; min-height:76px; font-family:inherit; }
  input[type=text]:focus, textarea:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(56,224,216,0.15); }

  .lang-row{ display:flex; gap:10px; }
  .lang-btn{
    flex:1; padding:12px 8px; border-radius:10px; border:1px solid var(--border);
    background:var(--night3); color:var(--muted); font-weight:600; text-align:center;
    cursor:pointer; transition:.2s;
  }
  .lang-btn.selected{
    background:linear-gradient(135deg,var(--mint),var(--cyan)); color:#062018;
    border-color:transparent; box-shadow:0 4px 14px rgba(61,220,151,0.35);
  }

  .btn{
    display:block; width:100%; padding:14px; border:none; border-radius:12px;
    font-size:1rem; font-weight:700; cursor:pointer;
    background:linear-gradient(135deg,var(--mint),var(--cyan)); color:#062018;
    box-shadow:0 6px 18px rgba(61,220,151,0.3);
    transition:transform .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn.secondary{ background:var(--night3); color:var(--text); border:1px solid var(--border); box-shadow:none; }
  .whatsapp-btn{ background:linear-gradient(135deg,#25D366,#128C7E); color:#fff; }

  .instructions{ font-size:0.82rem; color:var(--muted); line-height:1.5; }

    border-radius:20px;
    padding:5px 12px;
    font-size:0.72rem;

  .power-icon.active{ opacity:1; filter: drop-shadow(0 0 4px rgba(61,220,151,0.8)); }

  #controls{
    position:absolute; bottom:10px; left:8px; right:8px;
    display:flex; justify-content:space-between; align-items:flex-end;
    z-index:5;
  }
  .dpad{ display:flex; gap:8px; }
  .ctrl-btn{

    background:rgba(24,37,82,0.75);
    border:1px solid var(--border);
    color:var(--text);
    font-size:1.4rem;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(3px);
  }
  .action-btns{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .ctrl-btn.jump{ width:64px; height:64px; background:rgba(61,220,151,0.25); border-color:var(--mint); }
  .ctrl-btn.fire{ width:52px; height:52px; background:rgba(255,157,77,0.25); border-color:var(--gold); display:none; }
  .ctrl-btn.active-touch{ transform:scale(0.9); background:rgba(56,224,216,0.35); }

  #toast{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(6,10,22,0.85); border:1px solid var(--cyan);
    border-radius:14px; padding:14px 18px; max-width:82%;
    text-align:center; font-size:0.85rem; line-height:1.5;
    z-index:8; display:none;

  /* ===== TRIVIA MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(3,6,16,0.8);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
    backdrop-filter: blur(2px);

  .modal-overlay.active{ display:flex; }
  .modal-card{
    width:100%; max-width:420px;
    background:linear-gradient(160deg,#132049,#0c1533);
    border:1px solid var(--cyan); border-radius:18px; padding:20px;
    box-shadow:0 0 40px rgba(56,224,216,0.25);

  .modal-tag{ color:var(--gold); font-size:0.75rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px;}
  .modal-power{ color:var(--cyan); font-size:0.72rem; font-weight:600; margin-bottom:10px; }
  .modal-q{ font-size:1rem; margin-bottom:14px; line-height:1.4; }
  .option{

    border:1px solid var(--border); color:var(--text); padding:13px 14px;
    border-radius:12px; margin-bottom:10px; cursor:pointer; font-size:0.92rem; line-height:1.4;

  .option:disabled{ opacity:0.5; }
  .feedback-box{
    border-radius:12px; padding:12px 14px; font-size:0.88rem; line-height:1.4;
    border:1px solid var(--border); background:var(--night3);

  .feedback-box.good{ border-color:var(--mint); }
  .feedback-box.bad{ border-color:var(--danger); }

  /* ===== FINAL ===== */
  .final-score{
    text-align:center; font-size:2.2rem; font-weight:800;

  .final-rank{ text-align:center; font-size:1.05rem; font-weight:700; color:var(--gold); margin-top:-6px;}
  .anchor-verse{

</style>

let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function playTone(freq, dur, type='sine', vol=0.08, delay=0){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

    power:0, // 0 normal,1 super,2 fire,3 shield,4 fly
    player:{
      x:60, y:GROUND_Y-40, vx:0, vy:0,
      w:30, h:40, onGround:false, facing:1,
      invuln:0, flying:false,
    },
    mushrooms: MUSHROOMS.map(m=>({...m})),
    enemies: ENEMY_TEMPLATES.map(e=>({...e, alive:true, dir: -1})),
    fireballs: [],
    keys:{left:false,right:false,jump:false,fire:false},
    triviaOpen:false,
    activeMushroom:null,
    wrongAttempts:0,
    correctFirstTry:0,
    enemiesDefeated:0,
    triviaCooldownUntil:0,
    finished:false,
    lastTime:0,
  };
}

/* ============================================================
   HELPERS DE TEXTO / IDIOMA
============================================================ */
function T(key){ return UI[state.lang][key]; }

function setLang(lang){
  sfxClick();
  state.lang = lang;
  document.getElementById('btn-lang-es').classList.toggle('selected', lang==='es');
  document.getElementById('btn-lang-en').classList.toggle('selected', lang==='en');
  applyStaticTexts();
}

function applyStaticTexts(){
  document.getElementById('t-title').textContent = T('title');
  document.getElementById('t-subtitle').textContent = T('subtitle');
  document.getElementById('t-name-label').textContent = T('nameLabel');
  document.getElementById('t-lang-label').textContent = T('langLabel');
  document.getElementById('btn-start').textContent = T('start');
  document.getElementById('t-instructions').innerHTML = T('instructions');
  document.getElementById('input-name').placeholder = state.lang==='es' ? "Tu nombre..." : "Your name...";
  document.getElementById('t-final-title').textContent = T('finalTitle');
  document.getElementById('t-reflection-label').textContent = T('reflectionLabel');
  document.getElementById('input-reflection').placeholder = T('reflectionPlaceholder');
  document.getElementById('btn-whatsapp').textContent = T('whatsappBtn');
  document.getElementById('btn-restart').textContent = T('restart');
  document.getElementById('trivia-tag').textContent = T('triviaTag');
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============================================================
   INICIO
============================================================ */
function startGame(){
  const nameInput = document.getElementById('input-name');
  const name = nameInput.value.trim();
  if(!name){ alert(T('fillNameAlert')); nameInput.focus(); return; }
  ensureAudio();
  sfxClick();
  state.name = name;

  game = newGameState();
  showScreen('screen-game');
  updatePowerIcons();
  showToast(T('toastStart'), 2200);

  game.running = true;
  game.lastTime = performance.now();
  requestAnimationFrame(loop);
}

function showToast(msg, ms){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.style.display='none'; }, ms);
}

/* ============================================================
   CONTROLES (teclado + táctil)
============================================================ */
function bindControls(){
  window.addEventListener('keydown', e=>{
    if(!game) return;
    if(e.code==='ArrowLeft' || e.code==='KeyA') game.keys.left = true;
    if(e.code==='ArrowRight'|| e.code==='KeyD') game.keys.right = true;
    if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW') game.keys.jump = true;
    if(e.code==='KeyF') game.keys.fire = true;
  });
  window.addEventListener('keyup', e=>{
    if(!game) return;
    if(e.code==='ArrowLeft' || e.code==='KeyA') game.keys.left = false;
    if(e.code==='ArrowRight'|| e.code==='KeyD') game.keys.right = false;
    if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW') game.keys.jump = false;
    if(e.code==='KeyF') game.keys.fire = false;
  });

  const bindHold = (id, onDown, onUp)=>{
    const el = document.getElementById(id);
    const down = ev=>{ ev.preventDefault(); el.classList.add('active-touch'); onDown(); };
    const up = ev=>{ if(ev)ev.preventDefault(); el.classList.remove('active-touch'); onUp(); };
    el.addEventListener('touchstart', down, {passive:false});
    el.addEventListener('touchend', up, {passive:false});
    el.addEventListener('touchcancel', up, {passive:false});
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  };
  bindHold('btn-left',  ()=> game.keys.left = true,  ()=> game.keys.left = false);
  bindHold('btn-right', ()=> game.keys.right = true, ()=> game.keys.right = false);
  bindHold('btn-jump',  ()=> game.keys.jump = true,  ()=> game.keys.jump = false);
  bindHold('btn-fire',  ()=> throwFireball(), ()=>{});
}

/* ============================================================
   FÍSICA / COLISIONES
============================================================ */
const GRAVITY = 1400;
const MOVE_SPEED = 200;
const JUMP_VELOCITY = -680;
const FLY_LIFT = -520;
const FLY_GRAVITY = 420;
const SIZE_SMALL = {w:30, h:40};
const SIZE_BIG   = {w:34, h:56};

// Ajusta el tamaño físico y visual del jugador según su poder,
// manteniendo los pies en el mismo lugar (no lo hunde ni lo hace flotar).
function applyPlayerSize(){
  const p = game.player;
  const target = game.power >= 1 ? SIZE_BIG : SIZE_SMALL;
  if(p.w !== target.w || p.h !== target.h){
    const feetY = p.y + p.h;
    p.w = target.w;
    p.h = target.h;
    p.y = feetY - p.h;
  }
}

function aabbOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function playerBox(p){
  return {x:p.x, y:p.y, w:p.w, h:p.h};
}

function updatePlayerPhysics(dt){
  const p = game.player;
  const flying = game.power >= 4 && game.keys.jump && p.flying;

  // horizontal
  let ax = 0;
  if(game.keys.left){ ax = -1; p.facing = -1; }
  if(game.keys.right){ ax = 1; p.facing = 1; }
  p.vx = ax * MOVE_SPEED;

  // vertical / gravedad
  if(game.power >= 4 && p.flying){
    p.vy += (game.keys.jump ? FLY_LIFT*dt*3 : FLY_GRAVITY*dt);
    p.vy = Math.max(-260, Math.min(320, p.vy));
  } else {
    p.vy += GRAVITY * dt;
    if(game.keys.jump && p.onGround){
      p.vy = JUMP_VELOCITY;
      p.onGround = false;
      sfxJump();
      if(game.power >= 4) p.flying = true; // despega en modo vuelo si tiene alas
    }
  }

  // mover en X con colisión
  p.x += p.vx * dt;
  p.x = Math.max(0, Math.min(WORLD_W - p.w, p.x));
  resolveCollisions(p, 'x');

  // mover en Y con colisión
  p.y += p.vy * dt;
  p.onGround = false;
  resolveCollisions(p, 'y');

  if(p.onGround) p.flying = false;

  // caída al vacío -> reubicar en última plataforma segura (sin penalización dura)
  if(p.y > WORLD_H + 60){
    p.x = Math.max(0, p.x - 220);
    p.y = 0;
    p.vy = 0;
  }

  if(p.invuln > 0) p.invuln -= dt;
}

function resolveCollisions(p, axis){
  for(const plat of PLATFORMS){
    if(!aabbOverlap(playerBox(p), plat)) continue;
    if(axis==='x'){
      if(p.vx > 0) p.x = plat.x - p.w;
      else if(p.vx < 0) p.x = plat.x + plat.w;
    } else {
      if(p.vy > 0){ p.y = plat.y - p.h; p.vy = 0; p.onGround = true; }
      else if(p.vy < 0){ p.y = plat.y + plat.h; p.vy = 0; }
    }
  }
}

/* ============================================================
   HONGOS / TRIVIA
============================================================ */
function updateMushrooms(){
  const p = game.player;
  for(const m of game.mushrooms){
    if(m.collected) continue;
    const box = {x:m.x-18,y:m.y-18,w:36,h:36};
    if(aabbOverlap(playerBox(p), box) && !game.triviaOpen && performance.now() > game.triviaCooldownUntil){
      openTrivia(m);
      break;
    }
  }
}

function openTrivia(mushroom){
  game.triviaOpen = true;
  game.activeMushroom = mushroom;
  const trivia = TRIVIAS[mushroom.triviaIndex];

  document.getElementById('trivia-tag').textContent = T('triviaTag');
  document.getElementById('trivia-power').textContent = `${trivia.ref[state.lang]} · ${T('powerNames')[mushroom.triviaIndex]}`;
  document.getElementById('trivia-question').textContent = trivia.q[state.lang];
  document.getElementById('trivia-feedback').style.display = 'none';
  document.getElementById('btn-trivia-continue').style.display = 'none';

  const optsWrap = document.getElementById('trivia-options');
  optsWrap.innerHTML = '';
  trivia.opts[state.lang].forEach((text, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = text;
    btn.onclick = ()=> answerTrivia(idx, trivia, mushroom);
    optsWrap.appendChild(btn);
  });

  document.getElementById('trivia-modal').classList.add('active');
}

function answerTrivia(idx, trivia, mushroom){
  document.querySelectorAll('#trivia-options .option').forEach(b=> b.disabled = true);
  const correct = idx === trivia.correct;
  const fb = document.getElementById('trivia-feedback');
  fb.style.display = 'block';

  if(correct){
    sfxPower();
    mushroom.collected = true;
    game.power = Math.max(game.power, mushroom.triviaIndex+1);
    game.correctFirstTry += 1;
    applyPlayerSize();
    fb.className = 'feedback-box good';
    fb.textContent = T('triviaCorrect');
    updatePowerIcons();
  } else {
    sfxBad();
    game.wrongAttempts += 1;
    fb.className = 'feedback-box bad';
    fb.textContent = T('triviaWrong');
  }
  document.getElementById('btn-trivia-continue').style.display = 'block';
}

function closeTrivia(){
  sfxClick();
  document.getElementById('trivia-modal').classList.remove('active');
  game.triviaOpen = false;
  game.triviaCooldownUntil = performance.now() + 900;
}

/* ============================================================
   ENEMIGOS
============================================================ */
function updateEnemies(dt){
  const p = game.player;
  for(const e of game.enemies){
    if(!e.alive) continue;
    e.x += e.dir * e.speed * dt;
    if(e.x < e.minX){ e.x = e.minX; e.dir = 1; }
    if(e.x > e.maxX){ e.x = e.maxX; e.dir = -1; }

    const eBox = {x:e.x-16, y:e.y-16, w:32, h:32};
    if(!aabbOverlap(playerBox(p), eBox)) continue;

    const stomping = p.vy > 40 && (p.y + p.h) - e.y < 26;
    const hasShield = game.power >= 3;

    if(stomping || hasShield){
      defeatEnemy(e);
      if(stomping){ p.vy = JUMP_VELOCITY*0.55; }
    } else if(p.invuln <= 0){
      sfxHit();
      p.invuln = 1.2;
      p.vx = -p.facing*180;
      p.x = Math.max(0, p.x - p.facing*24);
    }
  }

  // colisión de bolas de fuego con enemigos
  for(const f of game.fireballs){
    if(!f.alive) continue;
    for(const e of game.enemies){
      if(!e.alive) continue;
      const eBox = {x:e.x-16, y:e.y-16, w:32, h:32};
      const fBox = {x:f.x-6, y:f.y-6, w:12, h:12};
      if(aabbOverlap(fBox, eBox)){
        defeatEnemy(e);
        f.alive = false;
      }
    }
  }
}

function defeatEnemy(e){
  if(!e.alive) return;
  e.alive = false;
  game.enemiesDefeated += 1;
  sfxStomp();
}

function throwFireball(){
  if(!game || game.power < 2 || game.triviaOpen) return;
  sfxFire();
  const p = game.player;
  game.fireballs.push({x:p.x + p.w/2, y:p.y + p.h/2, vx: p.facing*420, alive:true});
}

function updateFireballs(dt){
  for(const f of game.fireballs){
    if(!f.alive) continue;
    f.x += f.vx * dt;
    if(f.x < game.camX-40 || f.x > game.camX+520) f.alive = false;
  }
  game.fireballs = game.fireballs.filter(f=>f.alive);
}

/* ============================================================
   META
============================================================ */
function checkGoal(){
  const p = game.player;
  if(aabbOverlap(playerBox(p), GOAL)){
    finishGame();
  }
}

function finishGame(){
  if(game.finished) return;
  game.finished = true;
  game.running = false;
  sfxWin();
  renderFinal();
  setTimeout(()=> showScreen('screen-final'), 400);
}

/* ============================================================
   RENDER
============================================================ */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const VIEW_W = 480, VIEW_H = 720;

function draw(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);

  // fondo cielo con degradado calmante
  const sky = ctx.createLinearGradient(0,0,0,VIEW_H);
  sky.addColorStop(0,'#16306a'); sky.addColorStop(0.55,'#0b1a3f'); sky.addColorStop(1,'#060a17');
  ctx.fillStyle = sky; ctx.fillRect(0,0,VIEW_W,VIEW_H);

  ctx.save();
  ctx.translate(-game.camX, 0);

  // estrellas/decoración simple (paralaje leve)
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for(let i=0;i<60;i++){
    const sx = (i*137) % WORLD_W;
    const sy = (i*89) % 300;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // plataformas
  for(const plat of PLATFORMS){
    const grad = ctx.createLinearGradient(0,plat.y,0,plat.y+plat.h);
    grad.addColorStop(0,'#1f9b6e'); grad.addColorStop(1,'#0d3b2a');
    ctx.fillStyle = grad;
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    ctx.fillStyle = 'rgba(61,220,151,0.55)';
    ctx.fillRect(plat.x, plat.y, plat.w, 6);
  }

  // abismo final (marca visual)
  ctx.fillStyle = 'rgba(255,107,107,0.12)';
  ctx.fillRect(FINAL_GAP.x, 0, FINAL_GAP.x2-FINAL_GAP.x, VIEW_H);

  // hongos
  for(const m of game.mushrooms){
    if(m.collected) continue;
    drawMushroom(m.x, m.y);
  }

  // enemigos
  for(const e of game.enemies){
    if(!e.alive) continue;
    drawEnemy(e.x, e.y);
  }

  // bolas de fuego
  ctx.fillStyle = '#ff9d4d';
  for(const f of game.fireballs){
    if(!f.alive) continue;
    ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI*2); ctx.fill();
  }

  // meta
  drawGoal();

  // jugador
  drawPlayer();

  ctx.restore();
}

function drawMushroom(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(0,-6,16,Math.PI,0); ctx.fill();
  ctx.fillStyle = '#fff';
  [[-8,-10],[0,-16],[8,-10]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(dx,dy,3,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#f2e6d8';
  ctx.fillRect(-9,-4,18,16);
  ctx.restore();
}

function drawEnemy(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = '#3a2e5c';
  ctx.beginPath(); ctx.ellipse(0,0,16,14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(-5,-2,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-2,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a2e5c';
  ctx.beginPath(); ctx.arc(-5,-2,1.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,-2,1.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawGoal(){
  ctx.save();
  ctx.strokeStyle = '#eaf7f3'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(GOAL.x, GOAL.y+GOAL.h); ctx.lineTo(GOAL.x, GOAL.y); ctx.stroke();
  ctx.fillStyle = '#3ddc97';
  ctx.beginPath();
  ctx.moveTo(GOAL.x, GOAL.y);
  ctx.lineTo(GOAL.x+38, GOAL.y+14);
  ctx.lineTo(GOAL.x, GOAL.y+28);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  const p = game.player;
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2);
  if(p.facing < 0) ctx.scale(-1,1);

  if(p.invuln > 0 && Math.floor(p.invuln*12)%2===0){ ctx.restore(); return; }

  // escudo
  if(game.power >= 3){
    ctx.strokeStyle = 'rgba(56,224,216,0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,0, p.w*0.9, 0, Math.PI*2); ctx.stroke();
  }
  // alas
  if(game.power >= 4){
    ctx.fillStyle = 'rgba(234,247,243,0.85)';
    ctx.beginPath(); ctx.ellipse(-p.w*0.7, -4, 12, 7, 0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(p.w*0.7, -4, 12, 7, -0.4, 0, Math.PI*2); ctx.fill();
  }

  // cuerpo (crece si tiene power>=1)
  const bodyColor = game.power >= 2 ? '#ff9d4d' : '#3ddc97';
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

  // cabeza
  ctx.fillStyle = '#ffe0b2';
  ctx.beginPath(); ctx.arc(0, -p.h/2-6, 9, 0, Math.PI*2); ctx.fill();

  // ojo
  ctx.fillStyle = '#0b1229';
  ctx.beginPath(); ctx.arc(4, -p.h/2-6, 1.6, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function updatePowerIcons(){
  document.getElementById('icon-super').classList.toggle('active', game.power>=1);
  document.getElementById('icon-fire').classList.toggle('active', game.power>=2);
  document.getElementById('icon-shield').classList.toggle('active', game.power>=3);
  document.getElementById('icon-fly').classList.toggle('active', game.power>=4);
  document.getElementById('btn-fire').style.display = game.power>=2 ? 'flex' : 'none';
}

function updateCamera(){
  const p = game.player;
  game.camX = Math.max(0, Math.min(WORLD_W - VIEW_W, p.x - VIEW_W/2));
}

function updateHUDProgress(){
  const pct = Math.min(100, Math.round((game.player.x / (GOAL.x)) * 100));
  document.getElementById('hud-progress').textContent = pct + '%';
}

/* ============================================================
   GAME LOOP
============================================================ */
function loop(ts){
  if(!game || !game.running) return;
  const dt = Math.min(0.033, (ts - game.lastTime)/1000);
  game.lastTime = ts;

  if(!game.triviaOpen){
    updatePlayerPhysics(dt);
    updateMushrooms();
    updateEnemies(dt);
    updateFireballs(dt);
    updateCamera();
    updateHUDProgress();
    checkGoal();

    const p = game.player;
    if(p.x >= FINAL_GAP.x - p.w && p.x <= FINAL_GAP.x2 && game.power < 4){
      // sin alas no puede cruzar: se bloquea suavemente
      if(p.x + p.w > FINAL_GAP.x && p.vx > 0){ p.x = FINAL_GAP.x - p.w; }
    }
  }

  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   FINAL / RANK / WHATSAPP
============================================================ */
function computeScore(){
  const score = game.correctFirstTry*25 + game.enemiesDefeated*5 - game.wrongAttempts*3;
  return Math.max(0, score);
}
function getRank(score){
  if(score >= 140) return T('rankTop');
  if(score >= 80) return T('rankMid');
  return T('rankLow');
}

function renderFinal(){
  applyStaticTexts();
  const score = computeScore();
  document.getElementById('final-name-label').textContent = state.name;
  document.getElementById('final-score').textContent = `${score} PTS`;
  document.getElementById('final-rank').textContent = getRank(score);
  document.getElementById('final-verse').textContent = T('verse');
  document.getElementById('input-reflection').value = '';
}

function sendWhatsapp(){
  sfxClick();
  const reflection = document.getElementById('input-reflection').value.trim();
  if(!reflection){ alert(T('reflectionAlert')); document.getElementById('input-reflection').focus(); return; }
  const score = computeScore();
  const rank = getRank(score);

  let msg;
  if(state.lang === 'es'){
    msg = `¡Hola Maestro! Soy ${state.name}. Completé el Simulador INNER PEACE 🧠🕊️.\n` +
          `• Resultado: ${score} PTS (${rank})\n` +
          `• Escritura Ancla: Mateo 11:28\n` +
          `• Mi Reflexión: ${reflection}`;
  } else {
    msg = `Hello Teacher! I'm ${state.name}. I completed the INNER PEACE Simulator 🧠🕊️.\n` +
          `• Result: ${score} PTS (${rank})\n` +
          `• Anchor Scripture: Matthew 11:28\n` +
          `• My Reflection: ${reflection}`;
  }
  const encoded = encodeURIComponent(msg);
  const base = WHATSAPP_NUMBER ? `https://wa.me/${WHATSAPP_NUMBER}` : `https://wa.me/`;
  window.open(`${base}?text=${encoded}`, '_blank');
}

function restartGame(){
  sfxClick();
  game = null;
  document.getElementById('input-name').value = '';
  document.getElementById('input-reflection').value = '';
  document.getElementById('btn-fire').style.display = 'none';
  applyStaticTexts();
  showScreen('screen-start');
}

/* ============================================================
   INIT
============================================================ */
applyStaticTexts();
bindControls();
</script>
